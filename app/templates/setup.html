{% extends "base.html" %}
{% block content %}
<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg-base);">
    <div style="width:100%; max-width:480px; padding:24px;">

        <div style="text-align:center; margin-bottom:40px;">
            <div style="font-family:var(--font-mono); font-size:20px; font-weight:700; letter-spacing:0.2em; color:var(--accent); margin-bottom:8px;">
                CIRCE // ATHENA
            </div>
            <div style="font-family:var(--font-mono); font-size:11px; letter-spacing:0.12em; color:var(--text-secondary); text-transform:uppercase;">
                Configuracao Inicial
            </div>
        </div>

        <div class="card">
            <div class="section-header">Criar Operador Administrador</div>

            <div style="font-size:12px; color:var(--text-secondary); margin-bottom:20px; line-height:1.6;">
                Nenhum operador cadastrado. Crie o administrador inicial do sistema.
                Este operador tera acesso completo ao Athena.
            </div>

            {% if error %}
            <div class="alert-error">{{ error }}</div>
            {% endif %}

            <form method="post" action="/setup">
                <div class="form-group">
                    <label class="form-label">Nome de usuario *</label>
                    <input class="form-input" type="text" name="username"
                           autocomplete="off" autofocus required
                           placeholder="ex: jsilva">
                </div>
                <div class="form-group">
                    <label class="form-label">Nome completo *</label>
                    <input class="form-input" type="text" name="full_name"
                           autocomplete="off" required
                           placeholder="ex: Jose Silva">
                </div>
                <div class="form-group">
                    <label class="form-label">Senha * (minimo 12 caracteres)</label>
                    <input class="form-input" type="password" name="password"
                           autocomplete="new-password" required minlength="12">
                </div>
                <div class="form-group">
                    <label class="form-label">Confirmar senha *</label>
                    <input class="form-input" type="password" name="password_confirm"
                           autocomplete="new-password" required minlength="12">
                </div>
                <button class="btn-primary" type="submit">CRIAR ADMINISTRADOR</button>
            </form>
        </div>

    </div>
</div>
{% endblock %}
