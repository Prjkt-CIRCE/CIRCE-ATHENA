{% extends "base.html" %}
{% block content %}
<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg-base);">
    <div style="width:100%; max-width:400px; padding:24px;">

        <div style="text-align:center; margin-bottom:40px;">
            <div style="font-family:var(--font-mono); font-size:20px; font-weight:700; letter-spacing:0.2em; color:var(--accent); margin-bottom:8px;">
                CIRCE // ATHENA
            </div>
            <div style="font-family:var(--font-mono); font-size:11px; letter-spacing:0.12em; color:var(--text-secondary); text-transform:uppercase;">
                Sistema de Inteligencia Compartilhada
            </div>
        </div>

        <div class="card">
            <div class="section-header">Autenticacao</div>

            {% if error %}
            <div class="alert-error">{{ error }}</div>
            {% endif %}

            <form method="post" action="/login">
                <div class="form-group">
                    <label class="form-label">Usuario *</label>
                    <input class="form-input" type="text" name="username"
                           autocomplete="username" autofocus required>
                </div>
                <div class="form-group">
                    <label class="form-label">Senha *</label>
                    <input class="form-input" type="password" name="password"
                           autocomplete="current-password" required>
                </div>
                <button class="btn-primary" type="submit">ENTRAR</button>
            </form>
        </div>

        <div style="text-align:center; margin-top:24px; font-family:var(--font-mono); font-size:10px; color:var(--text-secondary); letter-spacing:0.08em;">
            ACESSO RESTRITO &mdash; NUCLEO DE INTELIGENCIA
        </div>

    </div>
</div>
{% endblock %}
