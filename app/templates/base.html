<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIRCE // ATHENA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* ── TOKENS — ADR-013 ── */
        :root {
            /* Fundos */
            --bg-base:        #1A1B1E;
            --bg-elevated:    #22232A;
            --bg-hover:       #2A2C36;
            --bg-sidebar:     #16171A;

            /* Bordas */
            --border-subtle:  #2C2E38;
            --border-strong:  #3D404B;

            /* Texto */
            --text-primary:   #E8E6E0;
            --text-secondary: #A8A6A0;
            --text-tertiary:  #6B6A66;
            --text-disabled:  #4A4A48;

            /* Accent — ciano Athena */
            --accent:         #5FB3CF;
            --accent-soft:    rgba(95, 179, 207, 0.10);
            --accent-strong:  #7DCCE8;

            /* Semânticas */
            --success:        #7CB87C;
            --warning:        #D9B25A;
            --error:          #D27773;
            --info:           #7AAFC9;
            --inactive:       #6B6A66;

            --success-soft:   rgba(124, 184, 124, 0.10);
            --warning-soft:   rgba(217, 178, 90,  0.10);
            --error-soft:     rgba(210, 119, 115, 0.10);
            --info-soft:      rgba(122, 175, 201, 0.10);

            /* Tipografia */
            --font-sans: 'Inter', system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', 'Courier New', monospace;

            /* Layout */
            --sidebar-width:    200px;
            --header-height:    52px;
            --statusbar-height: 28px;
        }

        /* ── RESET ── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        a { color: inherit; text-decoration: none; }
        a:visited { color: inherit; }

        body {
            background: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 14px;
            line-height: 1.5;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ── LAYOUT ── */
        .app-layout {
            display: flex;
            min-height: 100vh;
        }

        /* ── SIDEBAR ── */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            bottom: var(--statusbar-height);
            z-index: 200;
        }

        .sidebar__brand {
            padding: 16px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .sidebar__brand-name {
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.16em;
            color: var(--accent);
            text-transform: uppercase;
        }

        .sidebar__brand-sub {
            font-family: var(--font-mono);
            font-size: 9px;
            letter-spacing: 0.1em;
            color: var(--text-tertiary);
            text-transform: uppercase;
            margin-top: 3px;
        }

        .sidebar__nav {
            flex: 1;
            padding: 6px 0;
            overflow-y: auto;
        }

        .sidebar__nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 16px;
            font-family: var(--font-sans);
            font-size: 13px;
            font-weight: 400;
            color: var(--text-secondary);
            text-decoration: none;
            border-left: 2px solid transparent;
            transition: color 0.12s, background 0.12s;
        }

        .sidebar__nav a:hover {
            color: var(--text-primary);
            background: var(--bg-hover);
        }

        .sidebar__nav a.active {
            color: var(--accent);
            background: var(--accent-soft);
            border-left-color: var(--accent);
            font-weight: 500;
        }

        .sidebar__nav .nav-icon {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            opacity: 0.6;
        }

        .sidebar__nav a.active .nav-icon,
        .sidebar__nav a:hover .nav-icon { opacity: 1; }

        .sidebar__footer {
            padding: 12px 16px;
            border-top: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sidebar__footer-label {
            font-family: var(--font-mono);
            font-size: 9px;
            letter-spacing: 0.1em;
            color: var(--text-tertiary);
            text-transform: uppercase;
        }

        /* ── ÁREA PRINCIPAL ── */
        .main-area {
            margin-left: var(--sidebar-width);
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ── PAGE HEADER ── */
        .page-header {
            height: var(--header-height);
            background: var(--bg-elevated);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            padding: 0 24px;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .page-header__title {
            font-family: var(--font-sans);
            font-size: 17px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .page-header__subtitle {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.12em;
            color: var(--text-tertiary);
            text-transform: uppercase;
            margin-left: 10px;
            padding-bottom: 1px;
            align-self: flex-end;
        }

        .page-header__spacer { flex: 1; }

        .page-header__pill {
            display: flex;
            align-items: center;
            gap: 7px;
            background: var(--bg-base);
            border: 1px solid var(--border-strong);
            border-radius: 20px;
            padding: 5px 14px;
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.1em;
            color: var(--success);
            text-transform: uppercase;
        }

        .page-header__divider {
            width: 1px;
            height: 22px;
            background: var(--border-subtle);
            margin: 0 4px;
        }

        .page-header__user {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-header__avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--accent-soft);
            border: 1px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 500;
            color: var(--accent);
            flex-shrink: 0;
            letter-spacing: 0.05em;
        }

        .page-header__user-name {
            font-family: var(--font-sans);
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            line-height: 1.2;
        }

        .page-header__user-role {
            font-family: var(--font-mono);
            font-size: 9px;
            letter-spacing: 0.1em;
            color: var(--text-tertiary);
            text-transform: uppercase;
        }

        /* ── PÁGINA ── */
        .page-content {
            padding: 24px;
            flex: 1;
            padding-bottom: calc(var(--statusbar-height) + 24px);
        }

        /* ── STATUS BAR ── */
        .status-bar {
            height: var(--statusbar-height);
            background: var(--bg-sidebar);
            border-top: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            padding: 0 24px;
            gap: 20px;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 300;
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-tertiary);
            letter-spacing: 0.08em;
        }

        .status-bar__sep {
            color: var(--border-strong);
        }

        /* ── DOTS DE STATUS (SEM GLOW) ── */
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
            flex-shrink: 0;
        }

        .status-dot--ok    { background: var(--success); }
        .status-dot--warn  { background: var(--warning); }
        .status-dot--error { background: var(--error);   }
        .status-dot--info  { background: var(--info);    }

        /* ── CARDS ── */
        .card {
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: 4px;
            padding: 20px;
        }

        /* ── LABELS DE SEÇÃO ── */
        .section-label {
            font-family: var(--font-sans);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--text-tertiary);
            margin-bottom: 14px;
        }

        /* ── FORMULÁRIOS ── */
        .form-group { margin-bottom: 18px; }

        .form-label {
            display: block;
            font-family: var(--font-sans);
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .form-label .req { color: var(--accent); margin-left: 2px; }

        .form-input {
            width: 100%;
            background: var(--bg-base);
            border: 1px solid var(--border-strong);
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 14px;
            padding: 9px 12px;
            border-radius: 3px;
            outline: none;
            transition: border-color 0.12s, box-shadow 0.12s;
        }

        .form-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-soft);
        }

        .form-input::placeholder { color: var(--text-tertiary); }

        select.form-input { cursor: pointer; }

        /* ── BOTÕES ── */
        .btn-primary {
            background: var(--accent);
            color: #0d1317;
            border: none;
            font-family: var(--font-sans);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.02em;
            padding: 9px 20px;
            border-radius: 3px;
            cursor: pointer;
            transition: opacity 0.12s;
            white-space: nowrap;
        }

        .btn-primary:hover    { opacity: 0.88; }
        .btn-primary:disabled { opacity: 0.38; cursor: not-allowed; }

        .btn-secondary {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-strong);
            font-family: var(--font-sans);
            font-size: 13px;
            font-weight: 400;
            padding: 8px 16px;
            border-radius: 3px;
            cursor: pointer;
            transition: color 0.12s, border-color 0.12s;
        }

        .btn-secondary:hover {
            color: var(--text-primary);
            border-color: var(--accent);
        }

        .btn-text {
            background: none;
            border: none;
            color: var(--accent);
            font-family: var(--font-sans);
            font-size: 13px;
            cursor: pointer;
            padding: 0;
            transition: opacity 0.12s;
        }

        .btn-text:hover { opacity: 0.75; }

        .btn-logout {
            background: none;
            border: 1px solid var(--border-strong);
            color: var(--text-tertiary);
            font-family: var(--font-sans);
            font-size: 12px;
            padding: 4px 12px;
            cursor: pointer;
            border-radius: 3px;
            transition: color 0.12s, border-color 0.12s;
        }

        .btn-logout:hover { color: var(--error); border-color: var(--error); }

        /* ── ALERTAS ── */
        .alert {
            border-radius: 3px;
            padding: 10px 14px;
            margin-bottom: 18px;
            font-family: var(--font-sans);
            font-size: 13px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .alert--error   { background: var(--error-soft);   border: 1px solid var(--error);   color: var(--error);   }
        .alert--warning { background: var(--warning-soft); border: 1px solid var(--warning); color: var(--warning); }
        .alert--success { background: var(--success-soft); border: 1px solid var(--success); color: var(--success); }
        .alert--info    { background: var(--info-soft);    border: 1px solid var(--info);    color: var(--info);    }

        /* compat */
        .alert-error { background: var(--error-soft); border: 1px solid var(--error); color: var(--error);
                       border-radius: 3px; padding: 10px 14px; margin-bottom: 18px; font-size: 13px; }

        /* ── BADGES ── */
        .badge {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 2px 8px;
            border-radius: 2px;
            border: 1px solid currentColor;
            white-space: nowrap;
        }

        .badge--success { color: var(--success); background: var(--success-soft); }
        .badge--warning { color: var(--warning); background: var(--warning-soft); }
        .badge--error   { color: var(--error);   background: var(--error-soft);   }
        .badge--info    { color: var(--info);     background: var(--info-soft);    }
        .badge--muted   { color: var(--text-tertiary); background: rgba(107,106,102,0.1); }

        /* ── TABELAS ── */
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th {
            text-align: left;
            font-family: var(--font-sans);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--text-tertiary);
            padding: 8px 12px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .data-table td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-subtle);
            font-size: 13px;
            color: var(--text-primary);
        }

        .data-table .mono-cell {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-secondary);
        }

        .data-table tr:last-child td { border-bottom: none; }
        .data-table tr:hover td { background: var(--bg-hover); }

        /* ── GRID ── */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
        .grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 16px; }

        /* ── UTILITÁRIOS ── */
        .mono           { font-family: var(--font-mono); }
        .text-primary   { color: var(--text-primary); }
        .text-secondary { color: var(--text-secondary); }
        .text-tertiary  { color: var(--text-tertiary); }
        .text-accent    { color: var(--accent); }
        .text-success   { color: var(--success); }
        .text-warning   { color: var(--warning); }
        .text-error     { color: var(--error); }
        .text-sm        { font-size: 13px; }
        .text-xs        { font-size: 11px; }
        .text-xxs       { font-size: 10px; font-family: var(--font-mono); }
        .flex           { display: flex; }
        .flex-col       { flex-direction: column; }
        .items-center   { align-items: center; }
        .items-start    { align-items: flex-start; }
        .justify-between { justify-content: space-between; }
        .gap-2  { gap: 8px; }
        .gap-3  { gap: 12px; }
        .gap-4  { gap: 16px; }
        .mt-3   { margin-top: 12px; }
        .mt-4   { margin-top: 16px; }
        .mt-6   { margin-top: 24px; }
        .mb-4   { margin-bottom: 16px; }
        .mb-6   { margin-bottom: 24px; }
        .w-full { width: 100%; }
    </style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
